# @package _global_
defaults:
  - adamw
  - _self_

optimizer:
  hparams:
    lr: 0.003

lr_scheduler:
  name: ReduceLROnPlateau
  hparams:
    monitor: val_loss
    mode: min
    factor: 0.5
    patience: 5
    threshold: 1e-4
    threshold_mode: abs
    min_lr: 1e-6

