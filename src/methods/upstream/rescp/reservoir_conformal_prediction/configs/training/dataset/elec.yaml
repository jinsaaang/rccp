# @package _global_

#### Dataset params ###########################################################
dataset:
  name: elec
  connectivity:
    method: identity
    threshold: 0.1
    include_self: False
    layout: edge_index

#### Windowing params #########################################################
window: 6 # 10 minutes sampling -> 1 day before window
horizon: 1
stride: 1
delay: 6

scale_target: True
add_exogenous: True