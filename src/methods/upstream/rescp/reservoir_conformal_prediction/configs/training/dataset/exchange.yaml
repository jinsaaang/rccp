# @package _global_

#### Dataset params ###########################################################
dataset:
  name: exchange
  connectivity:
    method: identity
    threshold: 0.1
    include_self: False
    layout: edge_index

#### Windowing params #########################################################
window: 30 # daily data
horizon: 1
stride: 1
delay: 7 # -> start the prediction after delay steps (predict t + delay + 1)

scale_target: True
add_exogenous: True