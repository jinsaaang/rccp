_target_: models.uncertainty.sota.rescp.RescpModel

# Native ResCP sampler. Defaults are ResCP Table 4 Beijing/RNN values.
hidden_size: 512
spectral_radius: 1.3
leaking_rate: 0.95
input_scaling: 0.25
density: 0.2
activation: tanh

temperature: 0.1
decay: linear
decay_rate: 0.99
similarity: cosine
sliding_window: 3200
eta: 0.0
n_quantiles: 100
topk_residuals: null
proposal_correction: false
proposal_correction_style: multiplicative_radius
proposal_correction_floor: 1.0
proposal_correction_max_points: null
proposal_correction_ewma_beta: null
proposal_correction_ewma_min_scale: 1.0e-6
seed: 0
eps_floor: 1.0e-6

scale_reservoir_input: true
reservoir_scale_axis: global
location_batch: false
